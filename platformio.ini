; PlatformIO display-test firmware.
; Environment names use: epd_<size>_<controller-or-driver>_<color>_<board>.
; Keep environment identifiers lowercase; panel/controller macros remain uppercase.

[platformio]
default_envs = epd_42_ssd1683_bw_c3_supermini

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 460800
lib_deps =
    zinggjm/GxEPD2@^1.5.0

c3_supermini_flags =
    -DBOARD_PROFILE_ESP32_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
c3_std_flags =
    -DBOARD_PROFILE_ESP32_C3
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
c3_wroom02_flags =
    -DBOARD_PROFILE_ESP32_C3_WROOM02
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
wroom32e_flags =
    -DBOARD_PROFILE_ESP32_WROOM32E
smt_wroom32e_flags =
    -DBOARD_PROFILE_SMT_WROOM32E
s3_flags =
    -DBOARD_PROFILE_YD_ESP32_S3_N16R8
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
panel_42_flags =
    -DEPD_WIDTH=400
    -DEPD_HEIGHT=300
panel_213_flags =
    -DEPD_WIDTH=250
    -DEPD_HEIGHT=128
panel_213_landscape_flags =
    -DEPD_WIDTH=212
    -DEPD_HEIGHT=104
panel_29_flags =
    -DEPD_WIDTH=296
    -DEPD_HEIGHT=128
panel_583_flags =
    -DEPD_WIDTH=648
    -DEPD_HEIGHT=480
panel_75_flags =
    -DEPD_WIDTH=800
    -DEPD_HEIGHT=480

; Generic SSD1683 software-SPI profile. Supported tested panel families:
; Waveshare 4.2" V2 (400x300) and Zhongjingyuan 4.2" BW (400x300).
; Other SSD1683 modules may need different panel settings/LUT and are not
; assumed compatible based only on the controller name.
[env:epd_42_ssd1683_bw_c3_supermini]
extends = common
board = esp32-c3-devkitm-1
build_flags =
    ${common.c3_supermini_flags}
    ${common.panel_42_flags}
    -DEPD_PANEL_42_SSD1683_BW
    -DEPD_BPP=1

